<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SIT Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
background: white;
font-family: 'Segoe UI', Arial, sans-serif;
margin: 0;
padding: 0;
min-height: 100vh;
}
header {
background-color: red;
color: white;
font-family: serif;
text-align: center;
padding: 10px 0;
}
nav a {
color: blue;
margin: 0 20px;
text-decoration: none;
}
nav a:hover {
text-decoration: underline;
}
.link{
background: #D3D3D3;
text-align: center;
}
/* .row {
font-size: 0; 
} */
.block {
display: inline-block;
width: 33%;
vertical-align: top;
background: #fff;
box-sizing: border-box;
font-size: 14px;
padding: 10px;
text-align: left;
}
.marquee {
display: inline-block;
width: 33%;
vertical-align: top;
background: red;
color: white;
box-sizing: border-box;
font-size: 16px;
padding: 10px;
text-align: center;
}


.register-button {
background-color: #0B3D91; 
color: white;
padding: 10px 20px;
border-radius: 5px;
border: none;
text-decoration: none;
display: inline-block;
text-align: center;
cursor: pointer;
}
.register-button a {
color: white;
text-decoration: none;
}


.tech-button {
border: none;
background-color: white;

}

.tech-button img {
height: 50px;
width: 80px;
}

.contact {
background-color: red;
color: white;
text-align: center;
}
</style>
</head>
<body>
<header>
<h1>SIT Nagpur News Portal</h1>
</header>

<nav>
<div class="link">
<a href="https://sitnagpur.edu.in/">SIT Website </a>
<a href="https://sitnagpur.edu.in/news-media">Latest News </a>
<a href="https://sitnagpur.edu.in/contactus">Contact Us </a>
</div>
</nav>

<div class="row">
<div class="block">
<h2>Tech News</h2>
<p>Stay updated on technology trends and AI advancements</p>
<button class="tech-button">
<a href="https://openai.com/news/">
    <img src="oai.jpg" alt="Open AI">
</a>
</button>
</div>

<div class="marquee">
<marquee behavior="scroll" direction="left" scrollamount="8">
<a href="https://www.infosys.com/">🔊 Visit to Infosys</a>
<a href="">  |  </a>
<a href="https://webdevworkshop.io/">🖥 Workshop on Web Development</a> 
</marquee>
</div>

<div class="block">
<h2>Register Now</h2>
<p>Click below to join upcoming events.</p>
<button class="register-button">
<a href="2.html">Register</a>
</button>
</div>
</div>

<div class="contact">
<p>Contact: info@sitnagpur.ac.in | Phone: +91-123567890</p>
</div>
</body>
</html>
